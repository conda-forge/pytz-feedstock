{% set version = "2026.1.post1" %}

package:
  name: pytz
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pytz/pytz-{{ version }}.tar.gz
  sha256: 3378dde6a0c3d26719182142c56e60c7f9af7e968076f31aae569d72a0358ee1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - pytz
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://pythonhosted.org/pytz/
  license: MIT
  license_file: LICENSE.txt
  summary: World timezone definitions, modern and historical.
  description: |
    pytz brings the Olson tz database into Python. This library allows
    accurate and cross platform timezone calculations using Python 2.4 or
    higher. It also solves the issue of ambiguous times at the end of daylight
    saving time.
  doc_url: http://pythonhosted.org/pytz/
  dev_url: https://github.com/newvem/pytz

extra:
  recipe-maintainers:
    - msarahan
    - ocefpaf
